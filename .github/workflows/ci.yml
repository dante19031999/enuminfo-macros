name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permisos requeridos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # FASE 1: BUILD
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:latest # Puedes reemplazar con tu imagen propia
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --verbose

  # ------------------------------------------------------------------
  # FASE 2: TEST & AUDIT
  # ------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: rust:latest # O tu imagen personalizada con cargo-deny / audit preinstalados
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools (Omitir si usas imagen personalizada)
        run: |
          cargo install cargo-deny cargo-audit --locked

      - name: Run tests
        run: cargo test --verbose

      - name: Cargo Deny Check
        run: cargo deny check

      - name: Cargo Security Audit
        run: cargo audit

  # ------------------------------------------------------------------
  # FASE 3: RELEASE & PAGES
  # ------------------------------------------------------------------
  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: rust:latest # O tu imagen personalizada con cargo-about preinstalado
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools (Omitir si usas imagen personalizada)
        run: |
          cargo install cargo-about --locked

      - name: Build Documentation & Acknowledgements
        run: |
          cargo doc --no-deps
          cargo about generate about.hbs > target/doc/ACKNOWLEDGEMENTS.html
          
          # Crear redirección index.html -> documentación del crate principal
          # Cambia "enuminfo_macros" por el nombre real de tu caja en snake_case
          echo '<meta http-equiv="refresh" content="0; url=enuminfo_macros/index.html">' > target/doc/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target/doc'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4